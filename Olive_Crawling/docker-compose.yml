services:
  crawler:
    build: .
    env_file:
      - .env
    shm_size: '2gb'
    deploy:
      resources:
        limits:
          memory: 4G
    environment:
      - PYTHONUNBUFFERED=1
      - S3_BUCKET=${S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=ap-northeast-2
      - PERSON=${PERSON}
      - DETAIL_CONCURRENCY=${DETAIL_CONCURRENCY:-10}
      - PAGE_SIZE=${PAGE_SIZE:-20}
    command: ["--person", "${PERSON}", "--s3-bucket", "${S3_BUCKET}"]
    volumes:
      - ./output:/app/output
      - ./temp_crawl:/app/temp_crawl